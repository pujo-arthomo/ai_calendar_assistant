<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Calendar Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
  <h1>AI Calendar Assistant</h1>

  <!-- Availability -->
  <section>
    <h2>Check Availability</h2>
    <input type="date" id="dateInput" />
    <button onclick="checkAvailability()">Check</button>
    <div id="slots"></div>
  </section>

  <!-- Booking -->
  <section id="bookingSection" class="hidden">
    <h2>Book Selected Slot</h2>

    <label>Nama Pengirim</label>
    <input id="senderName" placeholder="Pujo Arthomo / Instansi / Tim" />

    <label>Nama Tamu</label>
    <input id="guestName" placeholder="Nama yang akan diajak meeting" />

    <label>Email Tamu</label>
    <input id="guestEmail" placeholder="email@example.com" />

    <label>Perihal Meeting</label>
    <input id="meetingTopic" placeholder="Koordinasi Arsip Digital" />

    <button onclick="bookSlot()">Book Slot</button>
  </section>

  <!-- Result -->
  <section id="result" class="hidden"></section>
</div>

<script src="script.js"></script>
</body>
</html>
